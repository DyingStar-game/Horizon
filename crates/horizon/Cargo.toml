[package]
name = "horizon"
version = "0.42.4"
edition = "2021"

[[bin]]
name = "horizon"
path = "src/main.rs"

[lib]
name = "lib_horizon"
path = "src/lib.rs"

[dependencies]
horizon_event_system = { workspace = true }
tracing-subscriber = { workspace = true }
plugin_system = { workspace = true }
game_server = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }

# === Tokio metrics ===
# tokio-metrics = { version = "0.4.6", features = ["metrics-rs-integration"] }
metrics = "0.24"
# metrics-exporter-prometheus = { version = "0.18", features = ["uds-listener"] }
tokio-blocked = "*"

[dev-dependencies]
tempfile = { workspace = true }